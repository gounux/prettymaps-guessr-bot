[project]
name = "prettymaps-guessr-bot"
version = "0.1.0"
description = "A mastodon bot that posts sone polls to guess the location of a random prettymaps map"
authors = [{ name = "gounux", email = "contact@guilhemallaman.net" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "prettymaps>=1.4.2,<2",
    "shapely>=2.1.2,<3",
    "colorlog>=6.12.0,<7",
    "mastodon-py>=2.2.2,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1,<5",
    "types-pyyaml>=6.0.12.12,<7",
    "types-requests>=2.31.0.7,<3",
]

[tool.uv]
default-groups = "all"
override-dependencies = ["numpy>=2,<2.3.0"]

[tool.uv.build-backend]
module-root = ""

[tool.isort]
profile = "black"
